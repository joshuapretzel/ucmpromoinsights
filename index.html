  const out = [];

        const { data, error } = await supabase.from("profiles").select("id, email, full_name, role").eq("id", userId).maybeSingle();

        if (error && error.code !== "PGRST116") {
          console.warn("profile fetch error", error);
        }

          const { data: inserted } = await supabase.from("profiles").insert({ id: userId, email }).select().maybeSingle();
          setProfile(inserted || null);

        setProfile(null);
      } finally {
        if (mounted) setLoading(false);
      }
    };

      if (!mounted) return;
      setSession(data.session);

      } else {
        setLoading(false);
      }

        setProfile(null);
        setLoading(false);

      subscription.unsubscribe();

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
  };

    const { error } = await supabase.auth.signUp({ email, password });
    if (error) throw error;
  };

    setSession(null);
    setProfile(null);
    setLoading(false);
